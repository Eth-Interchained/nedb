[package]
name = "nedb-node"
description = "napi-rs bindings for nedb-core → the @interchained/nedb npm package."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
nedb-engine = { path = "../../nedb-v2" }
serde_json = { version = "1", features = ["float_roundtrip"] }
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
