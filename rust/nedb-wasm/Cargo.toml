# nedb-wasm — NEDB v2 engine compiled to WebAssembly via wasm-bindgen.
# In-memory only (`Db::in_memory()`): no filesystem, no server, no threads.
# API mirrors the napi binding (crates/nedb-node) so the same engine contract
# holds across Node-native and browser runtimes.

[package]
name        = "nedb-wasm"
version     = "11.12.15"
edition     = "2021"
license     = "BUSL-1.1"
repository  = "https://github.com/aiassistsecure/nedb"
description = "NEDB v2 engine for the browser — wasm-bindgen bindings over the in-memory Db"

[lib]
crate-type  = ["cdylib", "rlib"]

[dependencies]
nedb-engine  = { path = "../nedb-v2", version = "12.15.16" }
serde_json   = { version = "1", features = ["preserve_order", "float_roundtrip"] }
wasm-bindgen = "0.2"

# wasm32-only: getrandom (via aes-gcm → rand_core) has no OS RNG on
# wasm32-unknown-unknown without its "js" feature (Web Crypto). Enabled here
# so the engine manifest stays exactly as-is for native builds; cargo's
# feature unification turns it on for the whole graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
