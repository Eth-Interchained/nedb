    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    environment:
      vars:
        RUST_TARGET: x86_64-apple-darwin
        WHEEL_LABEL: macos-x86_64
      groups:
        - nedb_secrets
