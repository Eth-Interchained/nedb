# Codemagic CI — NEDB macOS native wheels
#
# Builds the nedbd-v2 binary + maturin Python wheel for both Mac targets:
#   - aarch64-apple-darwin (Apple Silicon — M-series)
#   - x86_64-apple-darwin  (Intel Mac)
#
# Triggers on v* tags pushed to Eth-Interchained/nedb.
# Uploads the resulting wheels directly to PyPI via twine.
#
# Secrets required (set in Codemagic App Settings → Environment variables):
#   PYPI_API_TOKEN  — PyPI token with upload access to nedb-engine
#   GITHUB_TOKEN    — GitHub personal access token with 'repo' + 'write:packages' scope
#                     Used to upload Mac .node binaries to the GitHub release so
#                     GitHub's publish-npm job can assemble the complete npm bundle.
#
# How npm publishing works (split-build assembly):
#   1. GitHub CI builds Linux + Windows .node → uploads to GitHub release
#   2. Codemagic builds Mac arm64 + x86_64 .node → uploads to SAME GitHub release
#   3. GitHub's publish-npm polls the release until all 4 binaries are present
#   4. publish-npm downloads all, runs ONE npm publish with the complete bundle
#   PyPI wheels: each platform uploads independently (--skip-existing, no conflict)

# ── DISTRIBUTIONS (cryptoDB / nitroDB) ───────────────────────────────────────
# The flagship nedb-engine macOS workflows are below. The cryptoDB / nitroDB
# distro workflows are COPIES of them that (1) init their submodule and (2) cd
# into distributions/<distro> for every build step — self-contained, no app
# settings needed. They build/publish under the distro's renamed manifests via
# the same nedb_secrets tokens.

workflows:

  # ── Apple Silicon wheel (aarch64) ─────────────────────────────────────
  macos-arm64-wheel:
    name: "nedb-engine wheel — macOS arm64"
    max_build_duration: 60
    instance_type: mac_mini_m2   # Apple Silicon — M2 Mac Mini
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    environment:
      vars:
        RUST_TARGET: aarch64-apple-darwin
        WHEEL_LABEL: macos-arm64
      groups:
        - nedb_secrets          # contains PYPI_API_TOKEN + GITHUB_TOKEN
    scripts:
      - name: Install Rust
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup target add $RUST_TARGET
          echo "rustc: $(rustc --version)"

      - name: Install Python tools
        script: pip3 install --upgrade maturin twine

      - name: Build nedbd-v2 binary
        script: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          # Build from the workspace root (rust/) so cargo uses the workspace Cargo.lock.
          # Output lands in rust/target/<triple>/release/nedbd (workspace target dir).
          cd rust
          cargo build --release --bin nedbd --package nedb-engine --target $RUST_TARGET
          cd ..
          BIN="rust/target/$RUST_TARGET/release/nedbd"
          echo "Binary built: $(ls -lh $BIN)"
          cp "$BIN" python/nedb/nedbd-v2
          chmod +x python/nedb/nedbd-v2
          echo "Binary staged: $(ls -lh python/nedb/nedbd-v2)"

      # Staged by the COMMITTED SCRIPT, which is the only copy of this logic.
      #
      # These steps used to inline it, and the inline copy staged
      # `python/nedb/` but not `README.md` — so `maturin` failed with "Failed
      # to read readme specified in pyproject.toml" and BOTH macOS wheels for
      # v4.3.0 died while every GitHub Actions leg passed. release.yml had
      # already moved to the script and picked up the README automatically;
      # this file never adopted it and drifted.
      #
      # The script's own header records the same bug happening once before, in
      # test.yml. It exists to have ONE copy. Calling it is the fix.
      - name: Stage Python source + README + verify binary
        script: |
          bash scripts/stage_maturin.sh
          # Fail loudly rather than let maturin package a wheel without them.
          ls -lh rust/crates/nedb-py/README.md || { echo "ERROR: README.md missing!"; exit 1; }
          ls -lh rust/crates/nedb-py/python/nedb/nedbd-v2 || { echo "ERROR: nedbd-v2 missing!"; exit 1; }

      - name: Build wheel (maturin)
        script: |
          source "$HOME/.cargo/env"
          cd rust/crates/nedb-py
          maturin build --release --out ../../../dist --target $RUST_TARGET
          echo "Wheel:"
          ls -lh ../../../dist/*.whl

      - name: Publish to PyPI
        script: |
          TWINE_USERNAME=__token__ \
          TWINE_PASSWORD=$PYPI_API_TOKEN \
          twine upload --skip-existing --verbose dist/*.whl

      - name: Build napi addon (arm64)
        script: |
          source "$HOME/.cargo/env"
          npm install
          npx napi build --platform --release --target $RUST_TARGET \
            --cargo-cwd rust/crates/nedb-node
          echo "napi .node files: $(ls *.node 2>/dev/null)"

      - name: Upload Mac arm64 binaries to GitHub release
        script: |
          which gh || brew install gh
          # Hand gh a CLEAN token explicitly. Relying on implicit env pickup was
          # 401'ing: the same token authenticates fine via an explicit Bearer
          # header, so the value is valid — the failure is a trailing newline in
          # the Codemagic secret corrupting the Authorization header. Strip all
          # whitespace, set GH_TOKEN (gh prefers it over GITHUB_TOKEN), verify.
          export GH_TOKEN="$(printf '%s' "$GITHUB_TOKEN" | tr -d '[:space:]')"
          echo "gh token length: ${#GH_TOKEN}  (raw GITHUB_TOKEN length: ${#GITHUB_TOKEN})"
          gh auth status || true
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v$VERSION"
          echo "Uploading Mac arm64 artifacts to GitHub release $TAG"
          # nedbd-v2 server binary
          cp python/nedb/nedbd-v2 nedbd-v2-darwin-arm64
          gh release upload "$TAG" nedbd-v2-darwin-arm64 --repo Eth-Interchained/nedb --clobber
          # ── nesql CLI binary ───────────────────────────────────────────────
          #
          # THREE defects lived in the four lines this replaces, and together
          # they shipped npm a CLI-less package from v8.0.0 to v9.0.0 while
          # every build reported success:
          #
          # 1. The build was BARE -- the only cargo invocation in this file
          #    without `--target $RUST_TARGET`. On the Intel legs that builds
          #    for the arm64 HOST and names the result `nesql-darwin-x64`, so
          #    a success would have shipped the wrong architecture to Intel
          #    Macs. On every leg it also targets a different target-dir than
          #    the nedbd build just populated, so nothing was cached and the
          #    compile could not finish inside the 3.3s the step actually took.
          # 2. `cp rust/target/release/nesql` therefore read a path that does
          #    not exist, and this script has no `set -e`, so the failure
          #    continued into `chmod`, the smoke, and the upload -- all of
          #    which failed too.
          # 3. The step's exit status came from the trailing `|| true` loops
          #    below, so it reported SUCCESS with no asset uploaded. A silent
          #    failure is indistinguishable from a broken dependency, and this
          #    one cost four releases.
          #
          # Fixed by matching what nedbd does five lines above -- explicit
          # target, explicit path -- and by checking each step so a failure
          # says which one. Scoped deliberately: `set -e` is NOT applied to
          # the whole script, because that would convert every other latent
          # failure in it into a hard release stop in the same change.
          NESQL_SRC="rust/target/$RUST_TARGET/release/nesql"
          if ! ( cd rust && cargo build --release --bin nesql --package nesql --target "$RUST_TARGET" ); then
            echo "ERROR: nesql failed to build for $RUST_TARGET" >&2
            exit 1
          fi
          if [ ! -f "$NESQL_SRC" ]; then
            echo "ERROR: nesql built but $NESQL_SRC is absent. Contents of rust/target/$RUST_TARGET/release:" >&2
            ls -la "rust/target/$RUST_TARGET/release" 2>&1 | head -30 >&2
            exit 1
          fi
          cp "$NESQL_SRC" nesql-darwin-arm64
          chmod +x nesql-darwin-arm64
          # Assert the ARCHITECTURE, not just that a file exists. The bare
          # build would have produced a running arm64 binary here and the
          # version smoke below would have passed it -- on the Intel leg that
          # is precisely the wrong answer arriving green.
          file nesql-darwin-arm64
          case "$RUST_TARGET" in
            x86_64-apple-darwin)
              file nesql-darwin-arm64 | grep -q "x86_64" \
                || { echo "ERROR: nesql-darwin-arm64 is not x86_64 -- refusing to ship the wrong arch" >&2; exit 1; } ;;
            aarch64-apple-darwin)
              file nesql-darwin-arm64 | grep -q "arm64" \
                || { echo "ERROR: nesql-darwin-arm64 is not arm64 -- refusing to ship the wrong arch" >&2; exit 1; } ;;
          esac
          # A binary that builds can still panic on startup, and `cargo test`
          # never executes main. Only runnable natively.
          if [ "$RUST_TARGET" = "aarch64-apple-darwin" ]; then
            ./nesql-darwin-arm64 version
          else
            echo "  (startup check skipped -- x86_64 binary cross-built on an arm64 runner)"
          fi
          if ! gh release upload "$TAG" nesql-darwin-arm64 --repo Eth-Interchained/nedb --clobber; then
            echo "ERROR: failed to upload nesql-darwin-arm64 to release $TAG" >&2
            exit 1
          fi
          echo "nesql-darwin-arm64 uploaded to $TAG"
          # _native extension (so pypi fat-wheel includes it for Mac users)
          python3 scripts/extract_native.py "dist/*.whl" native-ext
          cp native-ext/nedb/_native* . 2>/dev/null || true
          for f in _native*darwin*arm64*; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --repo Eth-Interchained/nedb --clobber || true
          done
          # napi .node addon
          for f in *.node; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --repo Eth-Interchained/nedb --clobber || true
          done

    artifacts:
      - dist/*.whl
      - "*.node"

