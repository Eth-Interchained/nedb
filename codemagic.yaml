          cd distributions/aof-db
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup target add $RUST_TARGET
          echo "rustc: $(rustc --version)"

      - name: Install Python tools
        script: pip3 install --upgrade maturin twine

      - name: Build nedbd-v2 binary (cross-compile x86_64)
        script: |
          cd distributions/aof-db
          set -euo pipefail
          source "$HOME/.cargo/env"
          # Cross-compile x86_64 from M2: configure the Xcode clang linker explicitly
          export CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER="$(xcrun --find clang)"
          export CC_x86_64_apple_darwin="$(xcrun --find clang)"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          rustup target add $RUST_TARGET
          cd rust
          cargo build --release --bin nedbd --package nedb-engine --target $RUST_TARGET
          cd ..
          BIN="rust/target/$RUST_TARGET/release/nedbd"
          echo "Binary built: $(ls -lh $BIN)"
          cp "$BIN" python/nedb/nedbd-v2
          chmod +x python/nedb/nedbd-v2
          echo "Binary staged: $(ls -lh python/nedb/nedbd-v2)"

      - name: Stage Python source + verify binary
        script: |
          cd distributions/aof-db
          rm -rf rust/crates/nedb-py/python
          mkdir -p rust/crates/nedb-py/python
          cp -r python/nedb rust/crates/nedb-py/python/nedb
          find rust/crates/nedb-py/python/nedb -name "nedbd-v2*" -exec chmod +x {} \;
          echo "Staged $(find rust/crates/nedb-py/python/nedb -name '*.py' | wc -l) .py files"
          # Fail loudly if binary is missing — maturin include= needs it present
          ls -lh rust/crates/nedb-py/python/nedb/nedbd-v2 || { echo "ERROR: nedbd-v2 missing!"; exit 1; }

      - name: Build wheel (maturin)
        script: |
          cd distributions/aof-db
          source "$HOME/.cargo/env"
          cd rust/crates/nedb-py
          maturin build --release --out ../../../dist --target $RUST_TARGET
          echo "Wheel:"
          ls -lh ../../../dist/*.whl

      - name: Publish to PyPI
        script: |
          cd distributions/aof-db
          TWINE_USERNAME=__token__ \
          TWINE_PASSWORD=$PYPI_API_TOKEN \
          twine upload --skip-existing --verbose dist/*.whl

      - name: Build napi addon (x86_64)
        script: |
          cd distributions/aof-db
          source "$HOME/.cargo/env"
          npm install
          npx napi build --platform --release --target $RUST_TARGET \
            --cargo-cwd rust/crates/nedb-node
          echo "napi .node files: $(ls *.node 2>/dev/null)"

      - name: Upload Mac x86_64 binaries to GitHub release
        script: |
          cd distributions/aof-db
          which gh || brew install gh
          # Hand gh a CLEAN token explicitly. Relying on implicit env pickup was
          # 401'ing: the same token authenticates fine via an explicit Bearer
          # header, so the value is valid — the failure is a trailing newline in
          # the Codemagic secret corrupting the Authorization header. Strip all
          # whitespace, set GH_TOKEN (gh prefers it over GITHUB_TOKEN), verify.
          export GH_TOKEN="$(printf '%s' "$GITHUB_TOKEN" | tr -d '[:space:]')"
          echo "gh token length: ${#GH_TOKEN}  (raw GITHUB_TOKEN length: ${#GITHUB_TOKEN})"
          gh auth status || true
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v$VERSION"
          echo "Uploading Mac x86_64 artifacts to GitHub release $TAG"
          # nedbd-v2 server binary
          cp python/nedb/nedbd-v2 nedbd-v2-darwin-x64
          gh release upload "$TAG" nedbd-v2-darwin-x64 --repo Eth-Interchained/nedb --clobber
          # _native extension
          python3 scripts/extract_native.py "dist/*.whl" native-ext
          cp native-ext/nedb/_native* . 2>/dev/null || true
          for f in _native*darwin*x86_64*; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --repo Eth-Interchained/nedb --clobber || true
          done
          # napi .node addon
          for f in *.node; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --repo Eth-Interchained/nedb --clobber || true
          done

           # ── nesql CLI binary — LAST on purpose ─────────────────────────────
          #
          # This block used to sit directly after the nedbd upload, and its
          # hard `exit 1` then aborted the script before the `_native` and
          # `.node` uploads below. v9.0.1 shipped with NO darwin `.node`
          # assets at all for exactly that reason -- a missing CLI cost Mac
          # npm users their ADDON, which is strictly worse than the bug being
          # fixed. Failing loudly was right; failing loudly in the middle of a
          # sequence of INDEPENDENT uploads was not.
          #
          # So it runs last and records the failure instead of
          # short-circuiting: everything independently uploadable ships first,
          # and the step still exits non-zero at the very end.
          NESQL_FAILED=""
          NESQL_SRC="rust/target/$RUST_TARGET/release/nesql"
          # Codemagic's API exposes no build log for this account -- `logUrl`
          # is null on every action, and the artefacts zip carries only the
          # addon -- so a diagnosis has to survive as an ARTEFACT or it does
          # not survive at all. Hence the tee'd log, uploaded to the release
          # below whether this succeeds or fails.
          {
            echo "=== nesql staging for $RUST_TARGET ==="
            ( cd rust && cargo build --release --bin nesql --package nesql --target "$RUST_TARGET" ) 2>&1
            echo "cargo exit: $?"
            echo "--- expected: $NESQL_SRC ---"
            ls -la "rust/target/$RUST_TARGET/release/" 2>&1 | head -40
          } > nesql-build-x64.log 2>&1 || true
          if [ ! -f "$NESQL_SRC" ]; then
            echo "ERROR: nesql absent at $NESQL_SRC after build" >&2
            tail -40 nesql-build-x64.log >&2
            NESQL_FAILED="build"
          fi
          if [ -z "$NESQL_FAILED" ]; then
            cp "$NESQL_SRC" nesql-darwin-x64
            chmod +x nesql-darwin-x64
            # Assert the ARCHITECTURE, not merely that a file exists: the old
            # bare build produced a RUNNING arm64 binary that the version
            # smoke passed happily while being the wrong answer on Intel.
            #
            # `file -b` is load-bearing. Plain `file X` prints "X: <desc>",
            # so `file nesql-darwin-arm64 | grep -q arm64` matches the
            # FILENAME and the assertion is vacuous -- it passes for any
            # architecture whatsoever. The Intel leg only escaped because the
            # file is named `-x64` while the check greps `x86_64`. Caught by
            # simulating a wrong-arch binary, which exited 0. `-b` drops the
            # filename so the match is against the description alone.
            WANT="arm64"; [ "$RUST_TARGET" = "x86_64-apple-darwin" ] && WANT="x86_64"
            file -b nesql-darwin-x64 | tee -a nesql-build-x64.log
            if ! file -b nesql-darwin-x64 | grep -q "$WANT"; then
              echo "ERROR: nesql-darwin-x64 is not $WANT -- refusing to ship the wrong arch" >&2
              NESQL_FAILED="arch"
            fi
          fi
          if [ -z "$NESQL_FAILED" ] && [ "$RUST_TARGET" = "aarch64-apple-darwin" ]; then
            ./nesql-darwin-x64 version || NESQL_FAILED="startup"
          fi
          if [ -z "$NESQL_FAILED" ]; then
            if gh release upload "$TAG" nesql-darwin-x64 --repo Eth-Interchained/nedb --clobber; then
              echo "nesql-darwin-x64 uploaded to $TAG"
            else
              NESQL_FAILED="upload"
            fi
          fi
          gh release upload "$TAG" nesql-build-x64.log --repo Eth-Interchained/nedb --clobber || true
          if [ -n "$NESQL_FAILED" ]; then
            echo "ERROR: nesql-darwin-x64 did not ship (stage: $NESQL_FAILED)." >&2
            echo "       Every OTHER artifact in this step was uploaded; only nesql is missing." >&2
            echo "       Full build output: nesql-build-x64.log, attached to release $TAG." >&2
            exit 1
          fi
    artifacts:
      - dist/*.whl
      - "*.node"
      # The nesql staging log. Codemagic exposes no build log for this
      # account -- every action's `logUrl` is null -- so this is the only way
      # a failed nesql stage can be read after the fact. It is an artefact
      # here AS WELL AS a release asset because the release upload can itself
      # be the thing that failed.
      - "nesql-build-*.log"
      # The nesql staging log. Codemagic exposes no build log for this
      # account (every action's `logUrl` is null), so this is the ONLY way a
      # failed nesql stage can be read after the fact -- and the upload
      # branch below can itself be the thing that failed, which is why the
      # log is an artefact here as well as a release asset.
      - "nesql-build-*.log"

  # ── neSQL CLI on Apple hardware ───────────────────────────────────────
  #
  # The Mac legs for `nesql` run HERE rather than on GitHub-hosted macOS
  # runners. Not an architectural preference — a queueing one. The
  # github-hosted macos-14 and macos-13 pools sit queued long enough that a
  # pull request's Mac result arrives well after its Linux and Windows
  # results, and a signal that late stops being part of the loop. The M2 Mac
  # Mini here picks the job up immediately.
  #
  # (An earlier revision of .github/workflows/nesql-cli.yml argued the
  # opposite, on the grounds that a failure belongs next to the code rather
  # than in another dashboard. That argument was right about WHERE a failure
  # should surface and wrong about what it costs to wait for it. The GitHub
  # workflow still owns Linux and Windows, so the pull request keeps two of
  # its four legs inline.)
  #
  # PUSH-triggered, unlike every other workflow in this file. The others build
  # release artifacts and fire on a v* tag; this one is a test run and has to
  # answer while the branch is still being worked on.
  nesql-cli-macos:
    name: "neSQL CLI — macOS (arm64 native + x86_64 cross)"
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "hyperagent/*"
          include: true
        - pattern: "master"
          include: true
    environment:
      vars:
        CARGO_TERM_COLOR: always
        RUST_BACKTRACE: "1"
    scripts:
      - name: Install Rust (arm64 host + x86_64 target)
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup target add x86_64-apple-darwin
          echo "rustc: $(rustc --version)"

      # Named explicitly: a bare workspace build drags in the napi and maturin
      # bindings, which need toolchains this job has no reason to install.
      - name: Build and test — arm64, natively
        script: |
          source "$HOME/.cargo/env"
          cd rust
          cargo build -p nesql --verbose
          cargo test  -p nesql --verbose

      # x86_64 is a BUILD check only, and says so. The host is Apple Silicon,
      # so an Intel test binary would run under Rosetta — and "the tests pass"
      # is a different claim from "the tests pass on Intel hardware". Compile
      # coverage is what this leg honestly provides.
      - name: Build — x86_64 (cross-compile; not executed)
        script: |
          source "$HOME/.cargo/env"
          cd rust
          cargo build -p nesql --target x86_64-apple-darwin --verbose

      # The binary has to actually run: cargo test never executes main, so a
      # crate whose tests pass can still panic on startup.
      - name: Smoke — version reports both dimensions
        script: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          cd rust
          out=$(cargo run -q -p nesql -- version)
          echo "$out"
          echo "$out" | grep -q '^nesql'  || { echo "no nesql version line";  exit 1; }
          echo "$out" | grep -q '^engine' || { echo "no engine version line"; exit 1; }

      - name: Smoke — a missing database is exit 4 and creates nothing
        script: |
          set -uo pipefail
          source "$HOME/.cargo/env"
          cd rust
          target="$TMPDIR/definitely-not-a-database"
          rm -rf "$target"
          set +e
          cargo run -q -p nesql -- --db "$target" status
          code=$?
          set -e
          [ "$code" -eq 4 ] || { echo "expected exit 4, got $code"; exit 1; }
          [ ! -e "$target" ] || { echo "a read-only command created $target"; exit 1; }
          echo "ok — exit 4, nothing created"

      - name: Smoke — grammar emits a 64-character digest
        script: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          cd rust
          out=$(cargo run -q -p nesql -- grammar --json)
          echo "$out" | grep -Eo '"digest": *"[0-9a-f]{64}"' \
            || { echo "grammar did not emit a 64-hex digest"; echo "$out"; exit 1; }

    artifacts:
      - rust/target/debug/nesql
      - rust/target/x86_64-apple-darwin/debug/nesql
